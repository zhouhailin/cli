name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo fmt
        run: cargo fmt --check
